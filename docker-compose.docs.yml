services:
  docs:
    image: health_huddle_local_docs
    container_name: health_huddle_local_docs
    build:
      context: .
      dockerfile: ./compose/local/docs/Dockerfile
    env_file:
      - path: ./.envs/.local/.django
        required: false
    volumes:
      - ./docs:/docs:z
      - ./config:/app/config:z
      - ./health_huddle:/app/health_huddle:z
    ports:
      - '9000:9000'
    command: /start-docs
